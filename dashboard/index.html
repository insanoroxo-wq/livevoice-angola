<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Painel do Streamer - LivePix Angola</title>
  <style>
    body {
      background-color: #0b0f19;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }

    h1 { color: #00e676; margin: 0; }

    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h3 { margin-top: 0; color: #38bdf8; }

    .campo { margin-bottom: 15px; }

    label { display: block; margin-bottom: 5px; font-size: 14px; }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      box-sizing: border-box;
    }

    .url-box {
      display: flex;
      gap: 10px;
    }

    .url-box input {
      flex: 1;
      color: #00e676;
      font-family: monospace;
    }

    button {
      padding: 10px 20px;
      background-color: #00e676;
      border: none;
      border-radius: 6px;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background-color: #00c853; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LivePix Angola 🚀</h1>
      <span>Bem-vindo, Streamer!</span>
    </header>

    <!-- Card do Link do OBS -->
    <div class="card">
      <h3>Link do Widget para o OBS Studio</h3>
      <p style="font-size: 13px; color: #94a3b8;">Cole este link como "Navegador" (Browser Source) no seu OBS Studio:</p>
      <div class="url-box">
        <input type="text" id="obsUrl" value="http://localhost:3001/widget/index.html" readonly>
        <button onclick="copiarLink()">Copiar</button>
      </div>
    </div>

    <!-- Card de Configuração de Valores em Kwanzas -->
    <div class="card">
      <h3>Configurações de Doação (Kwanzas)</h3>
      
      <div class="campo">
        <label>Valor Mínimo para Doar (Kz):</label>
        <input type="number" value="100">
      </div>

      <div class="campo">
        <label>Valor Mínimo para Ler Mensagem (TTS Voz) (Kz):</label>
        <input type="number" value="500">
      </div>

      <div class="campo">
        <label>Sua Conta / Telefone PayPay Angola:</label>
        <input type="text" placeholder="Ex: 923XXXXXX">
      </div>

      <button onclick="salvarConfig()">Salvar Configurações</button>
    </div>
  </div>

  <script>
    function copiarLink() {
      const copyText = document.getElementById("obsUrl");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link do Widget copiado com sucesso!");
    }

    function salvarConfig() {
      alert("Configurações salvas no servidor!");
    }
  </script>
</body>
</html>
